<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Booking | VenueVista</title>
<style>
:root{--navy:#07111f;--navy2:#0d1b2a;--panel:#101f31;--gold:#d9b85a;--gold2:#f0cf6a;--white:#f4f7fb;--muted:#9eafc3;--green:#54c98b;--red:#e66b6b;--border:rgba(217,184,90,.28)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--navy),#091727 55%,#0d1d31);color:var(--white);font-family:Arial,sans-serif;min-height:100vh}header{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%;background:rgba(7,17,31,.92)}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold2);font-weight:800;font-size:22px}.brand-name{font-size:21px;font-weight:700}.brand-subtitle{font-size:11px;color:var(--muted);margin-top:3px}.home-btn{color:var(--navy);background:var(--gold2);padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:700}main{width:min(1100px,90%);margin:45px auto}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:40px;margin:0 0 10px;color:var(--gold2)}.hero p{color:var(--muted)}.search-card,.booking-card{background:linear-gradient(180deg,#122237,#0d1b2a);border:1px solid var(--border);border-radius:14px;padding:25px;margin-bottom:22px}.search-card h2{margin:0 0 8px}.search-card p{color:var(--muted)}.search-row{display:flex;gap:10px}.search-row input,.field input,.field select,.field textarea{width:100%;background:#091625;border:1px solid #33465d;border-radius:8px;padding:12px;color:white;outline:none}.search-row input:focus,.field input:focus,.field select:focus{border-color:var(--gold2)}.search-btn,.action-btn,.save-btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.search-btn,.save-btn{background:var(--gold2);color:#07111f}.booking-top{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #25384f;padding-bottom:16px}.booking-id{font-size:20px;font-weight:700;color:var(--gold2)}.status{padding:7px 13px;border-radius:20px;font-weight:700;font-size:13px}.status.pending{background:#5d4b20;color:#f3d16a}.status.approved{background:#173e2c;color:#62d999}.status.rejected{background:#4b2023;color:#ff8585}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}.detail{background:#0a1727;border:1px solid #23374e;border-radius:9px;padding:13px}.detail-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:7px}.detail-value{font-weight:700}.remarks{border-left:3px solid var(--gold2);background:#0a1727;padding:15px;margin-top:10px}.remarks-title{font-weight:700;color:var(--gold2);margin-bottom:6px}.remarks-text{color:#c4d0dd;line-height:1.5}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.action-btn{color:white}.update{background:#356ea8}.revision{background:#80652a}.delete{background:#963f43}.message{display:none;background:#3d2426;border:1px solid #a34e53;padding:13px;border-radius:8px;margin-bottom:18px;color:#ffb4b4}.empty{text-align:center;padding:45px;color:var(--muted)}footer{text-align:center;color:#66798e;padding:25px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#102136;border:1px solid var(--border);border-radius:14px;padding:25px}.modal-box h2{color:var(--gold2);margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.modal-actions{display:flex;gap:10px;margin-top:20px}.cancel{background:#344456;color:white}.full{grid-column:1/-1}@media(max-width:700px){.details,.form-grid{grid-template-columns:1fr}.search-row{flex-direction:column}.booking-top{align-items:flex-start;flex-direction:column}}

/* Customer welcome dashboard - presentation-only addition */
.welcome-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:26px;align-items:center;padding:30px;margin:0 0 22px;border:1px solid rgba(240,207,106,.42);border-radius:18px;background:radial-gradient(circle at 92% 10%,rgba(240,207,106,.16),transparent 34%),linear-gradient(125deg,#182b42,#102034 58%,#13283d);box-shadow:0 16px 40px rgba(0,0,0,.18)}
.welcome-eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold2);font-size:12px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;margin-bottom:12px}.welcome-eyebrow:before{content:"";width:22px;height:2px;background:var(--gold2);border-radius:3px}.welcome-title{font-size:clamp(26px,3.4vw,38px);line-height:1.15;margin:0 0 10px;color:var(--white);letter-spacing:-.7px}.welcome-title span{color:var(--gold2)}.welcome-copy{margin:0;color:#b8c8d9;line-height:1.65;max-width:520px}.welcome-customer{display:flex;align-items:center;gap:13px;margin-top:22px}.welcome-avatar{width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#f0cf6a,#c5a34d);color:#0b1726;font-size:19px;font-weight:900;box-shadow:0 7px 18px rgba(217,184,90,.18)}.welcome-customer-name{font-weight:800;font-size:15px}.welcome-customer-meta{color:var(--muted);font-size:12px;margin-top:4px}.welcome-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.welcome-stat{background:rgba(5,16,29,.46);border:1px solid rgba(157,180,205,.16);border-radius:12px;padding:17px 16px;min-width:0}.welcome-stat-label{font-size:10px;color:#9fb2c7;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}.welcome-stat-value{font-size:23px;font-weight:800;color:#fff;overflow-wrap:anywhere}.welcome-stat-value.small{font-size:15px;color:var(--gold2)}.welcome-stat-note{font-size:11px;color:#91a5ba;margin-top:5px}
@media(max-width:760px){.welcome-card{grid-template-columns:1fr;padding:23px;gap:22px}.welcome-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome-title{font-size:29px}}
@media(max-width:420px){.welcome-stats{grid-template-columns:1fr 1fr}.welcome-stat{padding:13px}.welcome-stat-value{font-size:20px}}

</style>
</head>
<body>
<header><div class="brand"><div class="logo">V</div><div><div class="brand-name">VenueVista</div><div class="brand-subtitle">Smart Venue Booking & Layout Management</div></div></div><a href="/" class="home-btn">Book a Venue</a></header>
<main>
<section class="hero"><h1>My Booking</h1><p>Check, modify, revise or delete your booking request.</p></section>
<section class="search-card"><h2>Find Your Booking</h2><p>Enter your Customer ID or registered mobile number.</p><div class="search-row"><input id="searchInput" placeholder="Example: VV001 or 9128839530"><button class="search-btn" onclick="findBooking()">Check Booking</button></div></section>
<div id="message" class="message"></div><section id="results"></section>
</main>

<section id="reactUpdateCounterPanel" aria-label="Update confirmation" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(3,9,18,.72);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px;">
  <div id="reactUpdateCounterRoot" style="width:100%;max-width:480px;"></div>
</section>
\n<footer>© 2026 VenueVista · Smart Venue Booking System</footer>

<div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle">Update Booking</h2><div class="form-grid"><div class="field"><label>Customer Name (cannot be changed)</label><input id="fName" readonly aria-readonly="true" title="Customer name cannot be changed"></div><div class="field"><label>Phone</label><input id="fPhone"></div><div class="field"><label>Email</label><input id="fEmail"></div><div class="field"><label>Date of Birth</label><input id="fDob" type="date"></div><div class="field"><label>Hall</label><select id="fHall"><option>600x400</option><option>800x600</option><option>1000x700</option></select></div><div class="field"><label>Tables</label><input id="fTables" type="number" min="1"></div><div class="field"><label>Chairs / Table</label><input id="fChairs" type="number" min="1"></div><div class="field"><label>Event Date</label><input id="fDate" type="date"></div><div class="field"><label>Event Time</label><input id="fTime" type="time"></div><div class="field"><label>Table Shape</label><select id="fShape"><option>Square</option><option>Round</option><option>Rectangle</option></select></div><div class="field"><label>Table Design</label><select id="fDesign"><option>Classic</option><option>Modern</option><option>Luxury</option></select></div></div><div class="modal-actions"><button class="save-btn" onclick="saveBooking()">Save</button><button class="action-btn cancel" onclick="closeModal()">Cancel</button></div></div></div>
<!-- Experiment 4 React dependencies and update counter. Existing booking logic remains unchanged. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="/exp4/react-update-counter.js"></script>
<script>
let currentBooking=null;let actionMode="update";
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function showMessage(t){$("message").textContent=t;$("message").style.display="block"}
function clearMessage(){$("message").style.display="none"}
async function findBooking(){
 const q=$("searchInput").value.trim();$("results").innerHTML="";clearMessage();
 if(!q){showMessage("Please enter your Customer ID or mobile number.");return}
 try{const r=await fetch("/api/bookings");const d=await r.json();if(!d.success){showMessage("Unable to load booking information.");return}
 const bookings=d.bookings||[];const found=bookings.filter(b=>String(b.userId||"").toLowerCase()===q.toLowerCase()||String(b.phone||"")===q);
 if(!found.length){$("results").innerHTML='<div class="booking-card empty">No booking found for this Customer ID or mobile number.</div>';return}
 const customer=found[0];
 const pendingCount=found.filter(b=>String(b.adminApproval||"Pending").toLowerCase()==="pending").length;
 const approvedCount=found.filter(b=>String(b.adminApproval||"").toLowerCase()==="approved").length;
 const initials=String(customer.customerName||"Customer").trim().split(/\s+/).slice(0,2).map(part=>part.charAt(0).toUpperCase()).join("")||"C";
 $("results").innerHTML=`<section class="welcome-card" aria-label="Customer welcome dashboard">
   <div class="welcome-main">
     <div class="welcome-eyebrow">Welcome to VenueVista</div>
     <h2 class="welcome-title">Welcome back, <span>${esc(customer.customerName||"Customer")}</span></h2>
     <p class="welcome-copy">Your venue plans, all in one place. Review your booking details, make changes, or track the status of your requests below.</p>
     <div class="welcome-customer"><div class="welcome-avatar" aria-hidden="true">${esc(initials)}</div><div><div class="welcome-customer-name">${esc(customer.customerName||"Customer")}</div><div class="welcome-customer-meta">Customer ID: ${esc(customer.userId)} &nbsp;·&nbsp; ${esc(customer.phone||"Phone not provided")}</div></div></div>
   </div>
   <div class="welcome-stats">
     <div class="welcome-stat"><div class="welcome-stat-label">Your Requests</div><div class="welcome-stat-value">${found.length}</div><div class="welcome-stat-note">Booking record${found.length===1?"":"s"}</div></div>
     <div class="welcome-stat"><div class="welcome-stat-label">Awaiting Review</div><div class="welcome-stat-value">${pendingCount}</div><div class="welcome-stat-note">Pending request${pendingCount===1?"":"s"}</div></div>
     <div class="welcome-stat"><div class="welcome-stat-label">Approved</div><div class="welcome-stat-value">${approvedCount}</div><div class="welcome-stat-note">Confirmed request${approvedCount===1?"":"s"}</div></div>
     <div class="welcome-stat"><div class="welcome-stat-label">Account</div><div class="welcome-stat-value small">${esc(customer.userId)}</div><div class="welcome-stat-note">Your VenueVista ID</div></div>
   </div>
 </section><div class="booking-card"><div class="booking-top"><div><div style="color:#9eafc3;font-size:12px">CUSTOMER ID</div><div class="booking-id">${esc(customer.userId)}</div><div style="color:#9eafc3;margin-top:5px">${esc(customer.customerName)}</div></div><div style="color:#9eafc3">${esc(customer.phone)}</div></div></div>`;
 found.forEach(b=>$("results").insertAdjacentHTML("beforeend",card(b)));
 }catch(e){console.error(e);showMessage("Server connection failed. Make sure server.js is running.")}
}
function card(b){const s=b.adminApproval||"Pending";const cls=s.toLowerCase();const revision=b.revisionOf?`<div class="detail"><div class="detail-label">Revision Of</div><div class="detail-value">#${esc(b.revisionOf)}</div></div>`:"";return `<div class="booking-card"><div class="booking-top"><div class="booking-id">Booking Request #${esc(b.reqid)}</div><div class="status ${cls}">${s}</div></div><div class="details"><div class="detail"><div class="detail-label">Customer ID</div><div class="detail-value">${esc(b.userId)}</div></div><div class="detail"><div class="detail-label">Date of Birth</div><div class="detail-value">${esc(b.dateOfBirth||"Not provided")}</div></div><div class="detail"><div class="detail-label">Hall</div><div class="detail-value">${esc(b.hallDimension)}</div></div><div class="detail"><div class="detail-label">Tables</div><div class="detail-value">${esc(b.tables)}</div></div><div class="detail"><div class="detail-label">Seats</div><div class="detail-value">${Number(b.tables||0)*Number(b.chairsPerTable||0)}</div></div><div class="detail"><div class="detail-label">Date</div><div class="detail-value">${esc(b.eventDate)}</div></div><div class="detail"><div class="detail-label">Time</div><div class="detail-value">${esc(b.eventTime)}</div></div><div class="detail"><div class="detail-label">Shape</div><div class="detail-value">${esc(b.tableShape)}</div></div><div class="detail"><div class="detail-label">Design</div><div class="detail-value">${esc(b.tableDesign)}</div></div>${revision}</div><div class="remarks"><div class="remarks-title">Booking Update</div><div class="remarks-text">${esc((b.adminRemarks||"Under review").includes("Your modified booking has been updated in Experiment 2") ? "Your booking details have been saved successfully." : (b.adminRemarks||"Under review"))}</div></div><div class="actions"><button class="action-btn update" onclick="openModal(${b.reqid},'update')">Update</button><button class="action-btn revision" onclick="openModal(${b.reqid},'revision')">Create Revised Booking</button><button class="action-btn delete" onclick="deleteBooking(${b.reqid})">Delete</button></div></div>`}
function openModal(reqid,mode){currentBooking=JSON.parse(JSON.stringify((window.__bookings||[]).find(b=>Number(b.reqid)===Number(reqid))||{}));if(!currentBooking.reqid){const cards=document.querySelectorAll('.booking-card');}else{actionMode=mode;$("modalTitle").textContent=mode==="revision"?"Create Revised Booking":"Update Booking";$("fName").value=currentBooking.customerName||"";$("fPhone").value=currentBooking.phone||"";$("fEmail").value=currentBooking.email||"";$("fDob").value=currentBooking.dateOfBirth||"";$("fHall").value=currentBooking.hallDimension||"600x400";$("fTables").value=currentBooking.tables||1;$("fChairs").value=currentBooking.chairsPerTable||1;$("fDate").value=currentBooking.eventDate||"";$("fTime").value=currentBooking.eventTime||"";$("fShape").value=currentBooking.tableShape||"Square";$("fDesign").value=currentBooking.tableDesign||"Classic";$("modal").classList.add("show")}}
async function saveBooking(){if(!currentBooking)return;const payload={customerName:currentBooking.customerName,phone:$("fPhone").value.trim(),email:$("fEmail").value.trim(),dateOfBirth:$("fDob").value,hallDimension:$("fHall").value,tables:Number($("fTables").value),chairsPerTable:Number($("fChairs").value),eventDate:$("fDate").value,eventTime:$("fTime").value,tableShape:$("fShape").value,tableDesign:$("fDesign").value};let url,method;if(actionMode==="revision"){url=`/api/customers/${encodeURIComponent(currentBooking.userId)}/bookings/${currentBooking.reqid}/revise`;method="POST"}else{url=`/api/customers/${encodeURIComponent(currentBooking.userId)}/bookings/${currentBooking.reqid}`;method="PUT"}try{const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success){alert(d.message||"Operation failed.");return}closeModal();
if(actionMode==="update" && typeof window.venueVistaRecordSuccessfulUpdate==="function"){
  window.venueVistaRecordSuccessfulUpdate({
    customerName: currentBooking.customerName,
    customerId: currentBooking.userId
  });
} else {
  alert(d.message||"Saved successfully.");
}
findBooking()}catch(e){alert("Server connection failed.")}}
async function deleteBooking(reqid){if(!currentBooking)return; if(!confirm(`Delete booking #${reqid}?`))return;try{const r=await fetch(`/api/customers/${encodeURIComponent(currentBooking.userId)}/bookings/${reqid}`,{method:"DELETE"});const d=await r.json();if(!r.ok||!d.success){alert(d.message||"Unable to delete booking.");return}alert(d.message||"Booking deleted.");findBooking()}catch(e){alert("Server connection failed.")}}
function closeModal(){$("modal").classList.remove("show")}
const originalFind=findBooking;
findBooking=async function(){const q=$("searchInput").value.trim();try{const r=await fetch("/api/bookings");const d=await r.json();window.__bookings=d.bookings||[];}catch(e){window.__bookings=[]}return originalFind()};
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")findBooking()});
</script>
</body>
</html>
